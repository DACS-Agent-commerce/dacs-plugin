name: public-gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  public-gate:
    name: public-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"

      - name: Install root dependencies
        run: npm ci

      - name: Install gitleaks
        run: node scripts/ci/install-gitleaks.mjs --dir "${{ runner.temp }}/gitleaks"

      - name: Generic gate on the head commit
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "${{ runner.temp }}/gate-report"
          GITLEAKS_SHA256="$(sha256sum "${{ runner.temp }}/gitleaks/gitleaks" | cut -d ' ' -f 1)"
          npm run gate:generic -- --repo . --commit "$HEAD_COMMIT" --gitleaks "${{ runner.temp }}/gitleaks/gitleaks" --gitleaks-sha256 "$GITLEAKS_SHA256" --out "${{ runner.temp }}/gate-report/report.json"

      - name: Root tests
        run: npm test

      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: always()
        with:
          name: public-gate-report
          path: ${{ runner.temp }}/gate-report/report.json
          if-no-files-found: warn
